
name: Spring Boot CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: recuperer le code source
        uses: actions/checkout@v4

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: build and test
        run: mvn -B clean verify

      - name: build docker 
        run: docker build -t ghcr.io/laarifimohfst-maker/springboot-task-manager-devops:${{ github.sha }} -t ghcr.io/laarifimohfst-maker/springboot-task-manager-devops:latest .

      - name: login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push docker image to ghcr
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/laarifimohfst-maker/springboot-task-manager-devops:${{ github.sha }} 

      - name: push latest image to ghcr
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/laarifimohfst-maker/springboot-task-manager-devops:latest


    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/taskmanager
      SPRING_DATASOURCE_USERNAME: taskuser
      SPRING_DATASOURCE_PASSWORD: testpassword


    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: taskmanager
          POSTGRES_USER: taskuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskuser -d taskmanager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      

      